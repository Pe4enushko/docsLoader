[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "docs-loader"
version = "0.2.0"
description = "Internal pipeline for validating Russian clinic appointment data (PostgreSQL-backed)"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "python-dotenv>=1.0.1",
  "pydantic>=2.8.0",
  "psycopg[binary]>=3.0",
]

[tool.setuptools]
packages = ["engine"]
